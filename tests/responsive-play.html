<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sacramentum responsive play check</title>
<style>body{margin:16px;background:#30342e;color:#f5ead6;font:14px system-ui}header{display:flex;align-items:center;gap:20px;margin-bottom:12px}select{font:inherit;padding:8px}iframe{display:block;border:1px solid #91866c;width:360px;height:640px;margin:0 auto;background:#1c261f}p{margin:0}</style>
<header><label>Application viewport <select id="size"><option value="360x640">360 × 640</option><option value="640x360">640 × 360 landscape</option><option value="1280x900">1280 × 900</option></select></label><p>Real application in a sized frame. Uses ordinary controls and local saves. This is a browser layout check, not a physical device.</p></header>
<iframe id="game" title="Actual Sacramentum application" src="../index.html"></iframe>
<script>document.querySelector('#size').addEventListener('change',event=>{const [w,h]=event.target.value.split('x');const frame=document.querySelector('#game');frame.style.width=w+'px';frame.style.height=h+'px';});</script></html>
