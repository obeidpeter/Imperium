<!doctype html><html lang="en"><meta charset="utf-8"><title>Sacramentum QA fixtures</title><style>body{font:16px system-ui;padding:30px}textarea{width:95%;height:150px}</style><h1>Legal autoplay checkpoints</h1><p>Development-only test data. Generated from New Game using legal commands. Not shipped in dist.</p><label>Chapter <select id="chapter"><option>1</option><option>6</option><option selected>11</option><option>12</option></select></label><button id="load">Load checkpoint and UI trace</button><p id="status">Choose a fixture.</p><label>Checkpoint JSON<textarea id="checkpoint" readonly></textarea></label><label>Legal UI command trace<textarea id="trace" readonly></textarea></label><script type="module">
document.querySelector('#load').onclick=async()=>{const ch=Number(document.querySelector('#chapter').value);document.querySelector('#checkpoint').value=await (await fetch(`./fixtures/chapter-${ch}-legal-checkpoint.json`)).text();const trace=await(await fetch('./fixtures/ui-route-commands.json')).json();document.querySelector('#trace').value=JSON.stringify(trace.filter(r=>r.chapter===ch));document.querySelector('#status').textContent=`Chapter ${ch} checkpoint loaded from legal autoplay.`;};
</script></html>
