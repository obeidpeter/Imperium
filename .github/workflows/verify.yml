# Runs the project's own release check (tests, legal-command autoplay,
# expanded campaigns, production build, asset/offline checks and character
# audit) on every pull request and on main: on Node 20, the oldest version the
# project supports (package.json "engines"), and on Node 22. There are no
# dependencies to install. A second job drives the production build in
# headless Chromium (scripts/browser-smoke.mjs); Playwright is installed for
# that job only and is not a project dependency.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify

  smoke:
    name: browser smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke

  benchmark:
    name: twelve-chapter benchmark (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run benchmark -- --images tests/visual-results/v035 --report tests/visual-results/v035/benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chapter-benchmark
          path: tests/visual-results/v035/
          retention-days: 14
