# Runs the project's own release check (tests, legal-command autoplay,
# expanded, command and production campaigns, production build, asset/offline
# checks and character audits) on every pull request and on main: on Node 20,
# the oldest version the project supports (package.json "engines"), and on
# Node 22. There are no dependencies to install. Seven more jobs drive the
# production build in headless Chromium: the browser smoke test in two halves
# that run side by side (SMOKE_GROUP a, after the paused-order checks, and b,
# before the real-time and cavalry controls), the twelve-chapter screenshot benchmark
# (scripts/benchmark-campaign.mjs), whose captures are uploaded as an artifact,
# the usability and save-protection checks (scripts/usability-smoke.mjs), followed
# by the Chapter V courtyard pilot acceptance (scripts/ch5-pilot-smoke.mjs)
# and immersive layout/company-story checks (scripts/immersive-interface-smoke.mjs),
# the real-time 3D siege and rain review, with Palmyra's generated walls on
# Balanced held to 50 shader programs (scripts/campaign-world-smoke.mjs),
# the twelve camps' regional asset, service and cache checks in two parallel
# halves (scripts/regional-world-smoke.mjs --half a|b), and the 3D stage benchmark
# (scripts/benchmark-stage.mjs), which fails on a shader compiled in the first
# frame or in play, on more than 50 shader programs, or on draw calls, triangles
# or shader programs above the ceilings recorded in scripts/stage-ceilings.json,
# and whose report is uploaded. The desktop jobs package the Steam app (desktop/) on Linux and Windows and drive it
# through its interface (scripts/desktop-smoke.mjs); main's Windows run keeps the app folder as an artifact.
# Playwright is installed for those jobs only and is not a project dependency.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify

  smoke:
    name: browser smoke ${{ matrix.group }} (Chromium)
    runs-on: ubuntu-latest
    # The scenarios in two halves of about 18 minutes each in software
    # rendering (scripts/browser-smoke.mjs names group a; b is every other).
    # A slow runner has taken 13 minutes to install Chromium and three times
    # as long for each scenario.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Paused orders, cancellation and recorded debriefs
        if: matrix.group == 'a'
        run: npm run smoke:orders
      - run: npm run smoke
        env:
          SMOKE_GROUP: ${{ matrix.group }}
      - name: Real-time controls and unobstructed layouts
        if: matrix.group == 'b'
        run: node scripts/realtime-polish-smoke.mjs
      - name: Cavalry selection, command keys and remapping
        if: matrix.group == 'b'
        run: npm run smoke:cavalry
      - uses: actions/upload-artifact@v7
        if: always() && matrix.group == 'a'
        with:
          name: order-review-smoke
          path: tests/visual-results/order-review/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && matrix.group == 'a'
        with:
          name: performance-check-report
          path: tests/visual-results/performance-check/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && matrix.group == 'b'
        with:
          name: realtime-polish-smoke
          path: tests/visual-results/realtime-polish/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && matrix.group == 'b'
        with:
          name: cavalry-controls-smoke
          path: tests/visual-results/cavalry-controls/
          retention-days: 14

  usability:
    name: usability and navigation (Chromium)
    runs-on: ubuntu-latest
    # Usability, errands, the Chapter V pilot and world-first/company-story
    # checks (about 23 minutes in software rendering). Leave room for browser
    # installation and slow runners.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Usability, navigation and save protection
        run: npm run smoke:usability
      - name: Required tasks and undiscovered walking routes
        run: npm run smoke:navigation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playtest-navigation
          path: tests/visual-results/playtest-navigation/
          retention-days: 14
      - name: Tracked errand guidance and legal camp destinations
        run: npm run smoke:errands
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: errand-guidance-smoke
          path: tests/visual-results/errand-guidance/
          retention-days: 14
      - name: Chapter V courtyard and fortress pilot acceptance
        run: npm run smoke:ch5-pilot -- --river-gate
      - name: World-first layouts, camera controls and company stories
        run: npm run smoke:immersive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability-smoke
          path: tests/visual-results/usability/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chapter-v-pilot
          path: tests/visual-results/ch5-pilot/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: immersive-interface-smoke
          path: tests/visual-results/immersive-interface/
          retention-days: 14

  siege:
    name: 3D siege and rain (Chromium)
    runs-on: ubuntu-latest
    # The real-time 3D siege/rain review and Palmyra on Balanced (about 17
    # minutes in software rendering); a job of its own so the usability job
    # keeps its margin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Real-time 3D siege, bridges, rainy crossing and Palmyra's generated walls
        run: npm run smoke:siege
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: campaign-world-smoke
          path: tests/visual-results/campaign-world/
          retention-days: 14

  world:
    name: twelve camps ${{ matrix.half }} (Chromium)
    runs-on: ubuntu-latest
    # Every regional camp, services and residency, with cameras required to
    # settle and render fresh frames, in two halves run in parallel: a is
    # Chapters I-VII with Chapter I's services, the return and the failed
    # downloads; b is VII-XII with VIII's and XII's services, Performance and
    # the return to VII. Together they are the full acceptance. Software
    # rendering takes two to four minutes per camp, about half an hour a half;
    # leave room for a slow runner and browser installation. Individual action
    # and resource limits stay fixed.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: [a, b]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Twelve regional hubs, direct services and resource retirement (half ${{ matrix.half }})
        run: npm run smoke:world -- --half ${{ matrix.half }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regional-world-smoke-${{ matrix.half }}
          path: tests/visual-results/regional-world/
          retention-days: 14

  benchmark:
    name: twelve-chapter benchmark (Chromium)
    runs-on: ubuntu-latest
    # The scene inventory's own budget is 45 minutes (scripts/benchmark-campaign.mjs).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run benchmark -- --images tests/visual-results/v035 --report tests/visual-results/v035/benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chapter-benchmark
          path: tests/visual-results/v035/
          retention-days: 14

  stage-benchmark:
    name: 3D stage benchmark (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run benchmark:stage -- --dist --scenes ch5-mine,ch12-confrontation --check --max-programs 50 --ceilings scripts/stage-ceilings.json --report tests/visual-results/stage-benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage-benchmark
          path: tests/visual-results/stage-benchmark.json
          retention-days: 14

  # The desktop app for Steam (desktop/; docs/desktop.md): the desktop build packaged by electron-builder, then driven
  # through its visible interface (scripts/desktop-smoke.mjs) as Steam would install it, under a virtual display on
  # Linux and in the runner's session on Windows. Its packages install in desktop/ only; the web project stays
  # dependency-free.
  desktop:
    name: desktop app ${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} (Electron)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npm run build:desktop
      - run: npm ci
        working-directory: desktop
      - run: npm run package:${{ matrix.os == 'windows-latest' && 'win' || 'linux' }}
        working-directory: desktop
      - name: The packaged app, through its visible interface
        shell: bash
        run: ${{ matrix.os != 'windows-latest' && 'xvfb-run -a' || '' }} npm run smoke:desktop
        env:
          DESKTOP_APP: packaged
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: |
            tests/visual-results/desktop/report.json
            tests/visual-results/desktop/relaunch.png
          retention-days: 14
      # The Windows app folder, to try on a PC, from main's runs only (it is about 130 MB compressed). It is unsigned,
      # so Windows may warn before opening it.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest' && github.event_name == 'push'
        with:
          name: imperium-windows
          path: desktop/out/win-unpacked/
          retention-days: 7
