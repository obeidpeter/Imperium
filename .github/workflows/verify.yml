# Runs the project's own release check (tests, legal-command autoplay,
# expanded campaigns, production build, asset/offline checks and character
# audit) on every pull request and on main: on Node 20, the oldest version the
# project supports (package.json "engines"), and on Node 22. There are no
# dependencies to install.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify
