# Runs the project's own release check (tests, legal-command autoplay,
# expanded, command and production campaigns, production build, asset/offline
# checks and character audits) on every pull request and on main: on Node 20,
# the oldest version the project supports (package.json "engines"), and on
# Node 22. There are no dependencies to install. Five more jobs drive the
# production build in headless Chromium: the browser smoke test
# (scripts/browser-smoke.mjs, then the real-time checks of
# scripts/realtime-polish-smoke.mjs), the twelve-chapter screenshot benchmark
# (scripts/benchmark-campaign.mjs), whose captures are uploaded as an artifact,
# the usability and save-protection checks (scripts/usability-smoke.mjs), followed
# by the Chapter V courtyard pilot acceptance (scripts/ch5-pilot-smoke.mjs)
# and immersive layout/company-story checks (scripts/immersive-interface-smoke.mjs),
# then real-time 3D siege and rain review, with Palmyra's generated walls on
# Balanced held to 50 shader programs (scripts/campaign-world-smoke.mjs),
# the twelve camps' regional asset, service and cache checks
# (scripts/regional-world-smoke.mjs), and the 3D stage benchmark
# (scripts/benchmark-stage.mjs), which fails on a shader compiled in the first
# frame or in play, on more than 50 shader programs, or on draw calls, triangles
# or shader programs above the ceilings recorded in scripts/stage-ceilings.json,
# and whose report is uploaded.
# Playwright is installed for those jobs only and is not a project dependency.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify

  smoke:
    name: browser smoke (Chromium)
    runs-on: ubuntu-latest
    # Usually about 12 minutes. A slow runner has taken 13 minutes to install
    # Chromium and three times as long for each scenario (about 40 in all).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run smoke
      - name: Real-time controls and unobstructed layouts
        run: node scripts/realtime-polish-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: realtime-polish-smoke
          path: tests/visual-results/realtime-polish/
          retention-days: 14

  usability:
    name: usability and navigation (Chromium)
    runs-on: ubuntu-latest
    # Usability, the Chapter V pilot and world-first/company-story checks, plus
    # the real-time 3D siege/rain review and Palmyra on Balanced (10–18 minutes
    # in software rendering).
    # Leave room for browser installation and slow runners.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Usability, navigation and save protection
        run: npm run smoke:usability
      - name: Chapter V courtyard and fortress pilot acceptance
        run: npm run smoke:ch5-pilot -- --river-gate
      - name: World-first layouts, camera controls and company stories
        run: npm run smoke:immersive
      - name: Real-time 3D siege, bridges, rainy crossing and Palmyra's generated walls
        run: npm run smoke:siege
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usability-smoke
          path: tests/visual-results/usability/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chapter-v-pilot
          path: tests/visual-results/ch5-pilot/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: immersive-interface-smoke
          path: tests/visual-results/immersive-interface/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: campaign-world-smoke
          path: tests/visual-results/campaign-world/
          retention-days: 14

  world:
    name: twelve camps (Chromium)
    runs-on: ubuntu-latest
    # Every regional camp, services and residency, with cameras now required to
    # settle and render fresh frames. Windows software rendering takes about
    # four minutes per camp; leave room for the extra service/fallback checks
    # and browser installation. Individual action and resource limits stay fixed.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Twelve regional hubs, direct services and resource retirement
        run: npm run smoke:world
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regional-world-smoke
          path: tests/visual-results/regional-world/
          retention-days: 14

  benchmark:
    name: twelve-chapter benchmark (Chromium)
    runs-on: ubuntu-latest
    # The scene inventory's own budget is 45 minutes (scripts/benchmark-campaign.mjs).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run benchmark -- --images tests/visual-results/v035 --report tests/visual-results/v035/benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chapter-benchmark
          path: tests/visual-results/v035/
          retention-days: 14

  stage-benchmark:
    name: 3D stage benchmark (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run benchmark:stage -- --dist --scenes ch5-mine,ch12-confrontation --check --max-programs 50 --ceilings scripts/stage-ceilings.json --report tests/visual-results/stage-benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stage-benchmark
          path: tests/visual-results/stage-benchmark.json
          retention-days: 14
